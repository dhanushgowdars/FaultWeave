[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "faultweave"
version = "0.1.0"
description = "Log anomaly detection and incident localization in transaction microservices"
requires-python = ">=3.11"
dependencies = [
  "asyncpg==0.30.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["shared", "services/gateway"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI dependency injection intentionally uses Depends in defaults.
